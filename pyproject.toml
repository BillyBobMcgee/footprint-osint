[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "footprint-osint"
version = "0.3.0"
description = "A defensive OSINT tool — CLI and local web GUI — for checking email, password, domain, and username exposure across public breach data sources."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "footprint contributors" }]
keywords = ["osint", "security", "breach", "opsec", "cli", "gui", "hibp", "exposure", "dmarc", "subdomain-takeover"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
    "PySocks>=1.7",  # enables --tor SOCKS5 routing
]

[project.optional-dependencies]
holehe = [
    "holehe>=1.61",  # keyless registered-account discovery (email -> accounts)
]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "responses>=0.23",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/BillyBobMcgee/footprint"
Issues = "https://github.com/BillyBobMcgee/footprint/issues"

[project.scripts]
footprint = "footprint.cli:main"

[tool.setuptools.packages.find]
include = ["footprint*"]

[tool.setuptools.package-data]
# The GUI is a single hand-written page shipped inside the wheel.
"footprint.gui" = ["index.html"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
